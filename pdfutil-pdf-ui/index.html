<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFUtil · 智能文档与全文检索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', '"Noto Sans SC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              canvas: {
                bg: '#F5F3EF',
                sidebar: '#FAF9F6',
                surface: '#FFFFFF',
                subtle: '#EFECE6',
                hover: '#F0EDE7',
                border: '#E6E2DA',
                borderStrong: '#D5CFC4'
              },
              ink: {
                primary: '#1C1917',
                secondary: '#57534E',
                muted: '#8A847C',
                faint: '#A8A29E'
              },
              brand: {
                50: '#EEF2FF',
                100: '#E0E7FF',
                500: '#3B5BDB',
                600: '#2F4BC2',
                700: '#243B9E'
              },
              amberWarm: {
                50: '#FFFBEB',
                100: '#FEF3C7',
                500: '#D97706',
                600: '#B45309'
              },
              sage: {
                50: '#ECFDF5',
                100: '#D1FAE5',
                600: '#059669',
                700: '#047857'
              },
              rose: {
                50: '#FFF1F2',
                100: '#FFE4E6',
                200: '#FECDD3',
                300: '#FDA4AF',
                400: '#FB7185',
                500: '#F43F5E',
                600: '#E11D48',
                700: '#BE123C'
              }
            },
            boxShadow: {
              'craft-sm': '0 1px 2px rgba(28, 25, 23, 0.04), 0 0 0 1px rgba(28, 25, 23, 0.05)',
              'craft-md': '0 2px 6px -1px rgba(28, 25, 23, 0.05), 0 8px 20px -4px rgba(28, 25, 23, 0.05), 0 0 0 1px rgba(28, 25, 23, 0.06)',
              'craft-lg': '0 4px 12px -2px rgba(28, 25, 23, 0.06), 0 16px 36px -6px rgba(28, 25, 23, 0.07), 0 0 0 1px rgba(28, 25, 23, 0.06)',
              'craft-float': '0 12px 32px -4px rgba(28, 25, 23, 0.12), 0 2px 6px rgba(28, 25, 23, 0.06), 0 0 0 1px rgba(28, 25, 23, 0.08)',
              'paper': '0 2px 4px rgba(28, 25, 23, 0.04), 0 12px 28px -4px rgba(28, 25, 23, 0.08), 0 0 0 1px rgba(28, 25, 23, 0.07)'
            }
          }
        }
      };
    </script>
    <style>
      /* 页面加载遮罩样式 */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e9ecef;
        border-top: 4px solid #1e40af;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        color: #6c757d;
        font-size: 14px;
        font-family: "Microsoft YaHei", Arial, sans-serif;
      }

      /* 隐藏加载遮罩 */
      #app-loading.loaded {
        opacity: 0;
        pointer-events: none;
      }

      /* 防止未编译的Vue模板闪烁 */
      [v-cloak] {
        display: none !important;
      }

      /* 基础样式重置，防止样式闪烁 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">系统加载中...</div>
    </div>
    <div id="app" v-cloak></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
